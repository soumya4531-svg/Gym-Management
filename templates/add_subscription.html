{% extends "base.html" %}

{% block title %}Add Subscription Plan{% endblock %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 0 auto;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
        <h2>Add Subscription Plan</h2>
        <a href="{{ url_for('index') }}" class="btn" style="background-color: transparent; border: 1px solid var(--border-color); color: var(--text-main);">Back to Dashboard</a>
    </div>

    <form method="POST" action="{{ url_for('add_subscription') }}">
        <div class="form-group">
            <label for="name" class="form-label">Plan Name (e.g., Premium, Basic)</label>
            <input type="text" id="name" name="name" class="form-control" required autofocus>
        </div>
        
        <div class="form-group">
            <label for="duration_months" class="form-label">Duration (in months)</label>
            <input type="number" id="duration_months" name="duration_months" class="form-control" min="1" step="1" required>
        </div>

        <div class="form-group">
            <label for="price" class="form-label">Total Price (₹)</label>
            <input type="number" id="price" name="price" class="form-control" min="0" step="0.01" required>
        </div>

        <button type="submit" class="btn btn-secondary" style="width: 100%; margin-top: 1rem;">Create Plan</button>
    </form>
</div>
{% endblock %}
